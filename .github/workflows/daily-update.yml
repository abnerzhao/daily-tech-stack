name: Update daily issue

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional issue date in YYYY-MM-DD (defaults to Asia/Shanghai today)"
        required: false
        type: string
  schedule:
    # 10:00 Asia/Shanghai (UTC+8)
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and render the daily issue
        run: npm run daily:update
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          ISSUE_DATE: ${{ inputs.date }}
      - name: Commit the new issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "更新：$(TZ=Asia/Shanghai date +%F) 技术热榜"
          git push
